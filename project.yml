name: DiceLab
options:
  bundleIdPrefix: com.learnable
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: WEJF495R4D
    CODE_SIGN_STYLE: Automatic
targets:
  DiceLab:
    type: application
    platform: iOS
    sources:
      - path: DiceLab
        fileSystem: synchronized
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnable.DiceLab
        MARKETING_VERSION: "0.9.4"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        # No encryption beyond the OS's own — the build answers export compliance itself.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # String Catalog: compiler extraction feeds Resources/Localizable.xcstrings.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  DiceLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DiceLabTests
        fileSystem: synchronized
    dependencies:
      - target: DiceLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnable.DiceLabTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DiceLab:
    build:
      targets:
        DiceLab: all
        DiceLabTests: [test]
    test:
      targets:
        - DiceLabTests
