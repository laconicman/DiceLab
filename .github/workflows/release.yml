name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # On a tag push, checkout maps the event SHA onto refs/tags/<name>, so
      # the ref dereferences to the commit and the next step's `git cat-file
      # -t` can never see a tag object. `fetch-tags: true` collides with that
      # mapping (two refspecs, one destination); `fetch-depth: 0` fetches the
      # tag object but checkout then overwrites the ref with the commit when
      # its testRef comparison fails. One explicit forced fetch of the pushed
      # ref, after checkout is done, lands the tag object on the ref it owns.
      - name: Fetch the pushed tag object
        run: scripts/fetch_release_tag.sh "$GITHUB_REF_NAME"

      - name: Assert tag is annotated and matches MARKETING_VERSION
        run: |
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ] || \
            { echo "release titles need an annotated tag (git tag -a)"; exit 1; }
          TAG=${GITHUB_REF_NAME#v}
          VER=$(sed -n 's/.*MARKETING_VERSION: *"\(.*\)".*/\1/p' project.yml)
          [ "$VER" = "$TAG" ] || { echo "tag $GITHUB_REF_NAME != MARKETING_VERSION $VER"; exit 1; }

      - name: Create release
        # A block scalar, not a plain one: YAML folds a plain scalar's line
        # break into a space, so the trailing `\` escaped that space and gh
        # read ` --title` as an asset path (v1.1's run: "no matches found").
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --title "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
