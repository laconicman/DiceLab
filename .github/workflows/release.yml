name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The next step dereferences the pushed ref with `git cat-file -t`
          # to prove the tag is annotated (not lightweight). `fetch-tags:
          # true` alone collides with checkout's event-SHA-to-tag refspec
          # (actions/checkout handles both the commit mapping and tag
          # following for the same ref — Git rejects the duplicate dest);
          # fetching the full history avoids that path and still brings the
          # tag object into the working repo.
          fetch-depth: 0

      - name: Assert tag is annotated and matches MARKETING_VERSION
        run: |
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ] || \
            { echo "release titles need an annotated tag (git tag -a)"; exit 1; }
          TAG=${GITHUB_REF_NAME#v}
          VER=$(sed -n 's/.*MARKETING_VERSION: *"\(.*\)".*/\1/p' project.yml)
          [ "$VER" = "$TAG" ] || { echo "tag $GITHUB_REF_NAME != MARKETING_VERSION $VER"; exit 1; }

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes \
             --title "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
